<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="/src/style.css" />
      <link rel="icon" type="image/x-icon" href="/favicon.ico" />
      <title>Хепи Брдеј Диме!</title>
   </head>
   <body>
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>

      <div id="start-screen">
         <div>🎉 Let's get this party started! 🎉</div>
         <button id="start-btn">Start the Party</button>
      </div>
      <div id="message">🎉 Happy Birthday Dime! 🎉</div>

      <div id="loading">
         <div class="spinner"></div>
         <p class="message">Birthday loading...</p>
      </div>

      <audio id="bday-song" src="/assets/happy-birthday.mp3"></audio>

      <script type="module" src="/src/main.js"></script>
   </body>
</html>
